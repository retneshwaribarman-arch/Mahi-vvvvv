<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAHI</title>
<style>
  :root {
    --bg: #05060a;
    --text: #e8f1ff;
    --muted: #7d8aa3;
    --accent: #5ec8ff;
    --accent2: #a78bfa;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 35%, #0d1424 0%, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }

  /* Glowing ring around screen edges when active */
  .edge-glow {
    position: fixed; inset: 0; pointer-events: none;
    border-radius: 0;
    box-shadow: inset 0 0 0 0 transparent;
    transition: box-shadow .6s ease;
  }
  body.active .edge-glow {
    box-shadow: inset 0 0 40px 2px rgba(94,200,255,.45), inset 0 0 90px 10px rgba(167,139,250,.18);
  }

  header {
    width: 100%; max-width: 460px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 4px 6px;
  }
  .brand { font-weight: 700; letter-spacing: .25em; font-size: 15px; }
  .status {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b4256; }
  body.active .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  .orb-wrap {
    position: relative;
    width: min(70vw, 300px); height: min(70vw, 300px);
    margin-top: 16px;
    cursor: pointer;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .orb-label {
    position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%);
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }

  .greeting {
    margin-top: 42px; text-align: center;
  }
  .greeting h2 { font-size: 22px; font-weight: 600; }
  .greeting p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .reply {
    margin-top: 16px; min-height: 40px; max-width: 420px;
    text-align: center; font-size: 15px; line-height: 1.5;
    color: #cfe6ff; padding: 0 10px;
  }

  .shortcuts {
    width: 100%; max-width: 420px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-top: 24px;
  }
  .shortcut {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px 6px;
    text-align: center; color: var(--text); font-size: 12px;
    cursor: pointer; transition: transform .15s, background .2s;
  }
  .shortcut:active { transform: scale(.95); }
  .shortcut:hover { background: rgba(255,255,255,.09); }
  .shortcut .icon { font-size: 22px; display: block; margin-bottom: 6px; }

  .controls {
    margin-top: auto; margin-bottom: 26px;
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .small-btn {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 18px; cursor: pointer;
  }
  .mic {
    width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #05060a; font-size: 28px; font-weight: 700;
    box-shadow: 0 0 24px rgba(94,200,255,.35);
    transition: transform .15s, box-shadow .3s;
  }
  .mic:active { transform: scale(.94); }
  body.listening .mic { box-shadow: 0 0 40px rgba(94,200,255,.8); }
  .bg-avatar {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 15%;
    z-index: 0; transform-origin: center bottom;
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%   { transform: scale(1) translateY(0); }
    50%  { transform: scale(1.04) translateY(-8px); }
    100% { transform: scale(1) translateY(0); }
  }
  body.active .bg-avatar { animation-duration: 2.5s; filter: brightness(1.1) saturate(1.1); }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,6,10,.55) 0%, rgba(5,6,10,.05) 30%,
                rgba(5,6,10,.05) 50%, rgba(5,6,10,.85) 88%, rgba(5,6,10,.95) 100%);
  }
  header, .orb-wrap, .greeting, .reply, .shortcuts, .controls { position: relative; z-index: 2; }
  .edge-glow { z-index: 3; }

  .stage {
    position: fixed; left: 50%; top: 50%; z-index: 0;
    width: max(100vw, 100vh * 0.6691); height: max(100vh, 100vw * 1.4946);
    transform: translate(-50%, -50%);
    animation: breathe 6s ease-in-out infinite;
  }
  body.active .stage { animation-duration: 2.5s; }
  .layer { position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; }
  .legs { clip-path: inset(60% 0 0 0); animation: legs 3s ease-in-out infinite alternate; }
  .hand-r { clip-path: inset(22% 36% 68% 50%); transform-origin: 50% 80%; animation: wave 2.4s ease-in-out infinite; }
  .hand-l { clip-path: inset(53% 62% 36% 27%); transform-origin: 60% 0%; animation: swing 3.2s ease-in-out infinite alternate; }
  @keyframes legs { from { transform: translateX(-4px); } to { transform: translateX(4px); } }
  @keyframes wave { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
  @keyframes swing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  body.active .legs, body.active .hand-r, body.active .hand-l { animation-duration: 1.4s; }

  /* refined: feathered masks instead of hard clips, much smaller and slower motion */
  .legs, .hand-r, .hand-l, body.active .legs, body.active .hand-r, body.active .hand-l { clip-path: none; }
  .legs {
    -webkit-mask-image: linear-gradient(to bottom, transparent 56%, #000 68%);
            mask-image: linear-gradient(to bottom, transparent 56%, #000 68%);
    transform-origin: 50% 90%;
    animation: legsSway 6s ease-in-out infinite alternate;
  }
  .hand-r {
    -webkit-mask-image: radial-gradient(ellipse 8% 9% at 57% 27%, #000 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 8% 9% at 57% 27%, #000 55%, transparent 100%);
    transform-origin: 52% 36%;
    animation: handWave 5s ease-in-out infinite;
  }
  .hand-l {
    -webkit-mask-image: radial-gradient(ellipse 5% 6% at 31% 58%, #000 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 5% 6% at 31% 58%, #000 55%, transparent 100%);
    transform-origin: 30% 52%;
    animation: handSway 7s ease-in-out infinite alternate;
  }
  body.active .legs, body.active .hand-r, body.active .hand-l { animation-duration: 3s; }
  body.active .stage { animation-duration: 4s; }
  @keyframes legsSway { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
  @keyframes handWave { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
  @keyframes handSway { from { transform: rotate(-1deg); } to { transform: rotate(1.5deg); } }
  @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.012); } }

  /* ---- polish: glass controls, entrance animations, live effects ---- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseDot { 0%, 100% { box-shadow: 0 0 0 0 rgba(94,200,255,.6); } 70% { box-shadow: 0 0 0 9px rgba(94,200,255,0); } }
  @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
  @keyframes hueShift { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

  header .brand, .greeting, .reply { animation: fadeUp .8s ease both; }
  .greeting { animation-delay: .15s; }
  .reply { animation-delay: .3s; }

  body.active .dot { animation: pulseDot 1.6s ease-out infinite; }
  body.active .edge-glow { animation: hueShift 12s linear infinite; }

  .controls { padding: 12px 18px; border-radius: 999px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
              background: rgba(255,255,255,.04); border: 1px solid var(--border); width: auto; margin-bottom: 30px; }
  .small-btn { transition: transform .15s, background .2s; }
  .small-btn:hover { background: rgba(255,255,255,.12); }
  .small-btn:active { transform: scale(.92); }

  .mic { position: relative; }
  .mic::before, .mic::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(94,200,255,.6); opacity: 0; pointer-events: none;
  }
  body.listening .mic::before { animation: ripple 1.6s ease-out infinite; }
  body.listening .mic::after  { animation: ripple 1.6s ease-out .8s infinite; }
  body.listening .mic { transform: scale(1.05); }
  .mic { transition: transform .25s ease, box-shadow .3s; }

  .reply { text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  h2, .brand { text-shadow: 0 2px 14px rgba(0,0,0,.5); }

  /* ---- smooth parallax: screen gently follows phone tilt or pointer ---- */
  :root { --px: 0; --py: 0; }
  .stage {
    translate: calc(var(--px) * -14px) calc(var(--py) * -10px);
    transition: translate .6s cubic-bezier(.22,.61,.36,1);
    will-change: translate, transform;
  }
  .stage { animation-duration: 9s; }
  body.active .stage { animation-duration: 5s; }
  .greeting, .reply, header, .controls {
    transition: translate .6s cubic-bezier(.22,.61,.36,1);
    translate: calc(var(--px) * 4px) calc(var(--py) * 3px);
  }

  /* ---- when MAHI is active, the character waves hello ---- */
  body.active .hand-r {
    transform-origin: 55% 36%;
    animation: hiWave 1.1s ease-in-out infinite alternate;
  }
  body:not(.active) .hand-r {
    transform-origin: 55% 36%;
  }
  @keyframes hiWave {
    from { transform: rotate(-12deg); }
    to   { transform: rotate(9deg); }
  }

  /* ---- free (left) hand: swings loosely while MAHI is active ---- */
  .hand-l {
    -webkit-mask-image: radial-gradient(ellipse 6.5% 8% at 31.5% 58%, #000 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 6.5% 8% at 31.5% 58%, #000 55%, transparent 100%);
  }
  body.active .hand-l {
    transform-origin: 30% 50%;
    animation: freeSwing 1.8s ease-in-out infinite alternate;
  }
  @keyframes freeSwing {
    from { transform: rotate(-5deg) translateY(0); }
    to   { transform: rotate(5deg) translateY(-4px); }
  }


  /* ---- the hand holding the shirt stays still; the free hand does the waving ---- */
  .hand-r, body.active .hand-r, body:not(.active) .hand-r { animation: none; transform: none; }
  body.active .hand-l {
    transform-origin: 30% 50%;
    animation: hiWave 1.1s ease-in-out infinite alternate;
  }

  /* ---- both hands stay still ---- */
  .hand-l, body.active .hand-l, body:not(.active) .hand-l { animation: none; transform: none; }
  /* ---- Android additions: gear, modals ---- */
  .gear { position: fixed; top: 14px; right: 14px; z-index: 6; width: 38px; height: 38px; border-radius: 50%;
          border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; }
  header .status { margin-right: 46px; }
  .modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
           background: rgba(0,0,0,.6); padding: 20px; }
  .modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 360px; background: #0d1424; border: 1px solid var(--border); border-radius: 22px;
           padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .sheet h3 { font-size: 18px; }
  .sheet p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .sheet label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  .sheet label.row { flex-direction: row; align-items: center; gap: 10px; color: var(--text); }
  .sheet input[type=password], #typeInput { background: rgba(255,255,255,.06); border: 1px solid var(--border);
           border-radius: 12px; padding: 12px; color: var(--text); font-size: 15px; outline: none; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--border);
           background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }
  .btns button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #05060a; border: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="stage" aria-label="MAHI character">
    <div class="layer base"></div>
    <div class="layer hand-l"></div>
    <div class="layer hand-r"></div>
    <div class="layer legs"></div>
  </div>
  <div class="edge-glow"></div>

  <header>
    <div class="brand">MAHI</div>
    <div class="status"><span class="dot"></span><span id="statusText">Ready</span></div>
  </header>

  <div class="orb-wrap" id="orbWrap">
    <canvas id="orb" style="display:none"></canvas>
    <div class="orb-label" id="orbLabel">Tap orb or mic to talk</div>
  </div>

  <div class="greeting">
    <h2 id="greetTitle">Hello, Boss</h2>
    <p>Ami MAHI. Ki korte pari bolo.</p>
  </div>

  <div class="reply" id="reply"></div>

  <div class="controls">
    <button class="small-btn" id="keyboardBtn" title="Type">⌨</button>
    <button class="mic" id="micBtn" title="Talk">🎙</button>
    <button class="small-btn" id="powerBtn" title="On / Off">⏻</button>
  </div>

  <button class="gear" id="settingsBtn" title="Settings">⚙</button>

  <div class="modal" id="typeModal" hidden>
    <div class="sheet">
      <h3>Ki lekhbe?</h3>
      <input id="typeInput" type="text" placeholder="Lekho..." autocomplete="off">
      <div class="btns">
        <button id="typeCancel">Bad</button>
        <button id="typeSend" class="primary">Pathao</button>
      </div>
    </div>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="sheet">
      <h3>Settings</h3>
      <label>Gemini API key
        <input id="apiKeyInput" type="password" placeholder="AIza..." autocomplete="off">
      </label>
      <label class="row"><input type="checkbox" id="adultToggle"> 18+ voice mode</label>
      <div class="btns">
        <button id="accessBtn">Accessibility on koro</button>
        <button id="recordBtn">Screen record</button>
        <button id="cameraBtn">Camera</button>
      </div>
      <div class="btns">
        <button id="closeBtn">Bondho</button>
        <button id="saveBtn" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div class="modal" id="ageModal" hidden>
    <div class="sheet">
      <h3>18+ voice mode</h3>
      <p>Ei mode shudhu 18 bochor ba beshi bayosh manush-er jonno. Ha bole tumi nischit korcho je tumi 18 ar beshi.</p>
      <div class="btns">
        <button id="ageNo">Na</button>
        <button id="ageYes" class="primary">Ha, ami 18+</button>
      </div>
    </div>
  </div>

<script>
  // ---------- Particle sphere (rotating white dots) ----------
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const N = 420;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const rad = Math.sqrt(1 - y * y);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i;
    pts.push({ x: Math.cos(theta) * rad, y, z: Math.sin(theta) * rad, s: Math.random() * 0.6 + 0.4 });
  }

  let angle = 0;
  let level = 0;       // 0 idle -> 1 active
  let targetLevel = 0;
  let pulse = 0;

  function draw() {
    level += (targetLevel - level) * 0.05;
    angle += 0.003 + level * 0.012;
    pulse += 0.04 + level * 0.08;

    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * 0.38 * (1 + level * 0.08 * Math.sin(pulse));

    // soft glow
    const g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.3);
    g.addColorStop(0, `rgba(94,200,255,${0.08 + level * 0.12})`);
    g.addColorStop(1, 'rgba(94,200,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2); ctx.fill();

    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const projected = pts.map(p => {
      const x = p.x * cosA - p.z * sinA;
      const z = p.x * sinA + p.z * cosA;
      return { x, y: p.y, z, s: p.s };
    }).sort((a, b) => a.z - b.z);

    for (const p of projected) {
      const depth = (p.z + 1) / 2;
      const px = cx + p.x * R;
      const py = cy + p.y * R;
      const size = (0.6 + depth * 1.6) * p.s;
      ctx.fillStyle = `rgba(255,255,255,${0.15 + depth * 0.85})`;
      ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- State ----------
  const body = document.body;
  const statusText = document.getElementById('statusText');
  const orbLabel = document.getElementById('orbLabel');
  const reply = document.getElementById('reply');
  let listening = false;
  let active = false;

  function setActive(on) {
    active = on;
    body.classList.toggle('active', on);
    targetLevel = on ? 1 : 0;
    statusText.textContent = on ? 'Active' : 'Ready';
  }

  function setListening(on) {
    listening = on;
    body.classList.toggle('listening', on);
    orbLabel.textContent = on ? 'Shunchi... bolo' : 'Tap orb or mic to talk';
    if (on) setActive(true);
  }

  // ---------- Android bridge + browser fallback ----------
  const hasNative = typeof window.Android !== 'undefined';
  const typeModal = document.getElementById('typeModal');
  const typeInput = document.getElementById('typeInput');
  const settingsModal = document.getElementById('settingsModal');
  const ageModal = document.getElementById('ageModal');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const adultToggle = document.getElementById('adultToggle');
  let settings = { hasKey: false, adult: false, ageConfirmed: false };

  function say(t) { reply.textContent = t; }

  function handleCommand(text) {
    if (!text || !text.trim()) return;
    setActive(true);
    say('Sunchi, Boss...');
    if (hasNative) window.Android.ask(text);
    else say('Browser demo: "' + text + '" (Android app e Gemini kaj korbe)');
  }

  window.mahiReply = function (t) { say(t); statusText.textContent = active ? 'Active' : 'Ready'; };
  window.mahiStatus = function (t) {
    statusText.textContent = t;
    setTimeout(() => { statusText.textContent = active ? 'Active' : 'Ready'; }, 2500);
  };
  window.mahiSpeechResult = function (t) { say('Tumi bolecho: "' + t + '"'); handleCommand(t); };
  window.mahiListenEnd = function () { setListening(false); };

  function toggleMic() {
    if (listening) {
      if (hasNative) window.Android.stopListening();
      setListening(false);
      return;
    }
    if (hasNative) { window.Android.startListening(); setListening(true); }
    else say('Ei browser e voice support nai. Android app e chalao.');
  }

  document.getElementById('micBtn').addEventListener('click', toggleMic);
  document.getElementById('orbWrap').addEventListener('click', toggleMic);

  document.getElementById('powerBtn').addEventListener('click', () => {
    const on = !active;
    setActive(on);
    if (!on) setListening(false);
    if (hasNative) window.Android.setPower(on);
    say(on ? 'MAHI chalu ache, Boss.' : 'MAHI bondho.');
  });

  // Keyboard button -> text box (prompt() Android WebView-te kaj kore na)
  document.getElementById('keyboardBtn').addEventListener('click', () => {
    typeInput.value = '';
    typeModal.hidden = false;
    setTimeout(() => typeInput.focus(), 50);
  });
  document.getElementById('typeCancel').addEventListener('click', () => { typeModal.hidden = true; });
  document.getElementById('typeSend').addEventListener('click', () => {
    const t = typeInput.value;
    typeModal.hidden = true;
    handleCommand(t);
  });
  typeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('typeSend').click();
  });

  // ---------- Settings + 18+ gate ----------
  function loadSettings() {
    if (hasNative) { try { settings = JSON.parse(window.Android.getSettings()); } catch (_) {} }
  }

  document.getElementById('settingsBtn').addEventListener('click', () => {
    loadSettings();
    apiKeyInput.value = '';
    apiKeyInput.placeholder = settings.hasKey ? 'Key save ache (notun dile lekho)' : 'AIza...';
    adultToggle.checked = !!settings.adult;
    settingsModal.hidden = false;
  });

  adultToggle.addEventListener('change', () => {
    if (adultToggle.checked && !settings.ageConfirmed) {
      adultToggle.checked = false;
      ageModal.hidden = false;
    }
  });
  document.getElementById('ageNo').addEventListener('click', () => { ageModal.hidden = true; });
  document.getElementById('ageYes').addEventListener('click', () => {
    settings.ageConfirmed = true;
    adultToggle.checked = true;
    ageModal.hidden = true;
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (hasNative) window.Android.saveSettings(apiKeyInput.value, adultToggle.checked, settings.ageConfirmed);
    settingsModal.hidden = true;
    say('Settings save kora holo, Boss.');
  });
  document.getElementById('closeBtn').addEventListener('click', () => { settingsModal.hidden = true; });
  document.getElementById('accessBtn').addEventListener('click', () => { if (hasNative) window.Android.openAccessibility(); });
  document.getElementById('recordBtn').addEventListener('click', () => { if (hasNative) window.Android.toggleRecording(); });
  document.getElementById('cameraBtn').addEventListener('click', () => { if (hasNative) window.Android.takePhoto(); });

  // Smooth parallax: phone tilt (deviceorientation) or pointer position
  (function () {
    const root = document.documentElement;
    let tx = 0, ty = 0, cx = 0, cy = 0;
    function set(x, y) {
      tx = Math.max(-1, Math.min(1, x));
      ty = Math.max(-1, Math.min(1, y));
    }
    window.addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      set(e.gamma / 30, (e.beta - 45) / 30);
    });
    window.addEventListener('pointermove', e => {
      set((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * 2 - 1);
    });
    (function loop() {
      cx += (tx - cx) * 0.06;   // easing for smooth motion
      cy += (ty - cy) * 0.06;
      root.style.setProperty('--px', cx.toFixed(4));
      root.style.setProperty('--py', cy.toFixed(4));
      requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
</html>
